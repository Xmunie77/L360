name: Deploy — Learning 360° (Fly.io)

# Auto-deploys the l360 app to Fly on every push to main that touches l360/**
# (and on demand). Path-filtered so pushes touching only kitchentable (or
# other apps in this repo) don't redeploy l360, and vice versa. The image is
# built on Fly's remote builder (--remote-only), so no Docker is needed here.
#
# l360 lives in its own subdirectory with its own fly.toml/Dockerfile, so the
# config and dockerfile paths are passed explicitly and the build is run from
# the repo root (l360/Dockerfile expects a repo-root build context — see the
# NOTE in l360/fly.toml).
#
# Requires one repo secret:
#   FLY_API_TOKEN_L360  — a Fly deploy token scoped to app `l360-os`
#                          (Fly dashboard → Tokens, or
#                          `fly tokens create deploy -a l360-os`).
#                          Distinct from kitchentable's FLY_API_TOKEN — l360
#                          is a separate Fly app with its own token.

on:
  push:
    branches: [main]
    paths:
      - 'l360/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to Fly
        run: flyctl deploy --remote-only --config l360/fly.toml --dockerfile l360/Dockerfile
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_L360 }}
