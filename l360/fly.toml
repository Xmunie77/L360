# Learning 360° (l360) — room-booking + billing tool. Its own Fly app, its
# own repo (Xmunie77/L360), own Neon Postgres project, own schema.
#
# Deploy is automated by .github/workflows/deploy.yml on every push to main.
# First-time setup (one-off, from a browser or the Fly CLI):
#     fly apps create l360-os
#     fly secrets set -a l360-os \
#         DATABASE_URL='postgresql://…neon.tech/…?sslmode=require' \
#         L360_SESSION_SECRET='<64 hex chars>'
#
# Then run the gated migration once (creates the `l360` schema + tables) via
# the "Migrate — Alembic (l360 DB)" GitHub Action. See l360/DEPLOY.md.
#
# NOTE: l360/Dockerfile expects the *repo root* as its build context (it
# COPYs paths like `l360/web` and `l360/requirements.txt`), but this fly.toml
# lives inside l360/. Manual deploys must therefore be run from the repo
# root with explicit flags, not from within l360/:
#     fly deploy --config l360/fly.toml --dockerfile l360/Dockerfile
# (the CI workflow does exactly this). The `dockerfile` path below is only a
# fallback/documentation value; the flag above always wins.
#
# https://fly.io/docs/reference/configuration/

app = 'l360-os'
primary_region = 'fra'   # Frankfurt — matches Neon's recommended EU region

[build]
  dockerfile = 'Dockerfile'

[processes]
  # jobs = T-24h session reminders + educators' morning digest (l360/jobs.py).
  # Separate process so the 2-worker web app can't double-fire schedules;
  # the machine has no services so it never auto-stops. (P0-2, 31/08/2026)
  app = "sh -c \"python -c 'from l360.db import init_db; init_db()' && uvicorn l360.api:app --host 0.0.0.0 --port 8000 --workers 2\""
  jobs = "python -m l360.jobs"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1   # one machine always warm — cold starts made opening the app slow (Simon, 30/08/2026)
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512

# No persistent volume — Neon holds all state.
